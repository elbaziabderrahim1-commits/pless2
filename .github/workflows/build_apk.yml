name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter Project & Merge Code
        run: |
          mkdir temp_app
          flutter create temp_app --org com.example --template=app
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeApp-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
